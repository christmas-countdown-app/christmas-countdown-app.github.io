name: Rename to index
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: mv christmas-countdown.html index.html
      - name: Commit and push
        run: |
          git config user.name "christmas-countdown-app"
          git config user.email "christmas-countdown-app@users.noreply.github.com"
          git add -A
          git commit -m "Rename christmas-countdown.html to index.html"
          git push
