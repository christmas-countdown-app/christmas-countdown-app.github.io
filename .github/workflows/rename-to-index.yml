name: Rename christmas-countdown.html to index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f christmas-countdown.html ]; then
            mv christmas-countdown.html index.html
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rename christmas-countdown.html to index.html"
            git push
          else
            echo "christmas-countdown.html not found"
            exit 1
          fi
