name: Rename to index.html

on:
  push:
    branches:
      - main

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rename christmas-countdown.html to index.html
        run: |
          if [ -f christmas-countdown.html ]; then
            mv christmas-countdown.html index.html
            git config user.name "christmas-countdown-app"
            git config user.email "christmas-countdown-app@users.noreply.github.com"
            git add -A
            git commit -m "Rename christmas-countdown.html to index.html"
            git push
          fi
