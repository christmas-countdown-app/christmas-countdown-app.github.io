name: Rename to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename christmas-countdown.html to index.html
        run: |
          git config user.name "christmas-countdown-app"
          git config user.email "Lymacremix@gmail.com"
          git mv christmas-countdown.html index.html
          git commit -m "Rename christmas-countdown.html to index.html"
          git push
